openapi: 3.0.1
info:
  title: domain-payments API
  description: Durable payment orchestration domain
  contact:
    name: Development Team
    url: https://getfirefly.io
    email: developers@getfirefly.io
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: 1.0.0
servers:
- url: http://localhost:18080
  description: Generated server url
tags:
- name: Payments
  description: "Try, confirm, and cancel a payment"
paths:
  /api/v1/tenants/{tenant}/internal-payments:
    post:
      tags:
      - ManagedPaymentJourneys
      operationId: createManagedPaymentJourney
      parameters:
      - name: tenant
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Create"
        required: true
      responses:
        "201":
          description: New instruction accepted; financial state is explicit in receipt
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/View"
        "200":
          description: Current authorized replay
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/View"
        "400":
          description: Invalid or unsupported payment input
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/View"
        "401":
          description: Trusted current bearer required
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/View"
        "403":
          description: Current action or exact resource authority denied
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/View"
        "404":
          description: No payment visible to current authority
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/View"
        "409":
          description: Immutable intent or current state conflict
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/View"
        "503":
          description: Required peer or delegated authority unavailable
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/View"
      security:
      - managedPaymentBearer: []
      x-disable-idempotency: true
