          - VALIDATION
          - LIMIT_EXCEEDED
          - CURRENCY_NOT_IN_MASTER
          - CURRENCY_PAIR_NOT_CONFIGURED
          - SPACE_TYPE_NOT_CONFIGURED
          - ROUTE_NOT_CONFIGURED
          - UNBALANCED_POSTING
          - POSITION_FAILED
          - SYNC_REJECTED
          - RECORD_FAILED
          - COMPENSATED
          - NOT_FOUND
