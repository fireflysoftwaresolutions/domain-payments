components:
  schemas:
    Create:
      type: object
      properties:
        actionId:
          type: string
          format: uuid
        sourceAccountId:
          type: string
          format: uuid
        destinationAccountId:
          type: string
          format: uuid
        amount:
          type: number
        currency:
          type: string
        ttlSeconds:
          type: integer
          format: int32
        customerNotAfterEpochMillis:
          type: integer
          format: int64
      additionalProperties: false
    View:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
        createActionId:
          type: string
          format: uuid
        tenant:
          type: string
        sourceAccountId:
          type: string
          format: uuid
        destinationAccountId:
          type: string
          format: uuid
        amount:
          type: string
        currency:
          type: string
        currencyScale:
          type: integer
          format: int32
        currencyPolicy:
          type: string
        ttlSeconds:
          type: integer
          format: int32
        customerNotAfterEpochMillis:
          type: integer
          format: int64
        notAfterEpochMillis:
          type: integer
          format: int64
        initiator:
          type: string
        state:
          type: string
          enum:
          - RECEIVED
          - RESERVING
          - RESERVED
          - COMMITTING
          - CANCELLING
          - COMPLETED
          - REVERSED
          - CANCELLED
          - EXPIRED
          - RECOVERY_REQUIRED
        version:
          type: integer
          format: int64
        reservationId:
          type: string
          format: uuid
        postingId:
          type: string
          format: uuid
        reversalId:
          type: string
          format: uuid
        absenceReceiptId:
          type: string
          format: uuid
        ledgerVersion:
          type: integer
          format: int64
        observedAt:
          type: string
          format: date-time
        pendingEffectId:
          type: string
          format: uuid
        recoveryCode:
          type: string
        ledgerState:
          type: string
        reservationExpiresAt:
          type: string
          format: date-time
    Recovery:
      type: object
