          type: string
          enum:
          - DEBIT
          - CREDIT
        amount:
          type: number
        currency:
          type: string
    LedgerPosting:
      type: object
      properties:
        transactionId:
          type: string
          format: uuid
        idempotencyKey:
          type: string
        currency:
          type: string
        legs:
          type: array
          items:
            $ref: "#/components/schemas/LedgerLeg"
    MovementResult:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - INITIATED
          - COMPLETED
          - FAILED
          - UNMATCHED
          - CANCELLED
        scheme:
          type: string
          enum:
          - INTERNAL_TRANSFER
          - SPACE_TRANSFER
          - DOMESTIC_OUTBOUND
          - INTERNATIONAL_OUTBOUND
          - PSP_PAYOUT
          - RAIL_INBOUND
          - PSP_INBOUND
